# xApocalypse v1.6.2 - Balanced Configuration

debug-mode: false  # Set to true for detailed console logs

enabled-worlds:
  - world
  - world_nether
  - world_the_end

# Lobby worlds: zombie spawning and MythicMobs boss spawning are disabled here,
# but the blood moon bossbar and all other plugin systems still work normally.
# These worlds do NOT need to be in enabled-worlds.
lobby-worlds:
  - lobby

hooks:
  griefprevention:
    enabled: true
    prevent-spawning-in-claims: true  # Zombies won't spawn in protected areas

# Zombie Classes
zombie-classes:
  enabled: true

  # Spawn weights (must total ~1.0) - higher = more common
  weights:
    SWARMER: 0.35      # 35% chance - basic zombie
    RUNNER: 0.18       # 18% chance - fast, less HP
    MINER: 0.10        # 10% chance - breaks blocks
    NURSE: 0.07        # 7% chance - heals zombies
    SPITTER: 0.07      # 7% chance - ranged poison
    SCORCHED: 0.04     # 4% chance - fire zombie
    PSYCHOPATH: 0.03   # 3% chance - berserker
    TANK: 0.03         # 3% chance - high HP, armored
    WEBBER: 0.05       # 5% chance - places cobwebs
    BURSTER: 0.04      # 4% chance - explodes when close
    FROST: 0.04        # 4% chance - slows targets

  miner:
    enabled: true
    break-delay-ticks: 30  # Ticks between breaks (20 ticks = 1 second)
    drop-items: true       # Broken blocks drop items
    tower-min-height: 1.5  # Target height advantage that activates anti-tower digging
    tower-max-height: 4.0  # Prevents implausible remote digging beneath very tall targets
    tower-horizontal-range: 3.0 # How close the Miner must be to break beneath an elevated target
    breakables:            # Which blocks miners can break
      - DIRT
      - GRASS_BLOCK
      - COARSE_DIRT
      - STONE
      - COBBLESTONE
      - DEEPSLATE
      - COBBLED_DEEPSLATE
      - GLASS
      - TINTED_GLASS
      - OAK_PLANKS
      - SPRUCE_PLANKS
      - BIRCH_PLANKS
      - JUNGLE_PLANKS
      - ACACIA_PLANKS
      - DARK_OAK_PLANKS
      - MANGROVE_PLANKS
      - CHERRY_PLANKS
      - BAMBOO_PLANKS
      - CRIMSON_PLANKS
      - WARPED_PLANKS
      - PALE_OAK_PLANKS

  nurse:
    enabled: true
    heal-radius: 5.0           # Blocks - how far nurse can heal
    heal-amount-hp: 3.0        # HP healed (2 HP = 1 heart)
    interval-seconds: 3        # Cooldown between heals
    max-targets-per-tick: 5    # Max zombies healed at once

  runner:
    speed: 0.38                # Movement speed (normal = 0.35)
    health-multiplier: 0.75    # 75% of base HP

  tank:
    health: 50.0               # HP (normal = 25)
    knockback-resistance: 0.6  # 0.0 = none, 1.0 = immune

  spitter:
    enabled: true
    projectile-cooldown-seconds: 4  # Time between shots
    poison-duration-seconds: 6      # How long poison lasts
    poison-level: 2                 # Poison II
    impact-damage: 2.0              # Immediate damage on hit (2 HP = 1 heart)
    min-range: 1.5                  # Only disables shots at near-overlap range
    max-range: 18.0
    projectile-speed: 1.4
    retreat-range: 4.0              # Back away while targets are this close
    retreat-speed: 0.22

  scorched:
    enabled: true
    fire-duration-seconds: 4  # How long targets burn

  veteran:
    permanent: true           # Transformation stays forever (master toggle for veteran promotion)
    attack-bonus: 4.0         # Extra damage
    add-health: 0.0

  psychopath:
    attack-bonus: 2.0
    speed-bonus: 0.08
    rage-cooldown-seconds: 25  # Time between charges
    bleed-duration-seconds: 3

  frost:
    slowness_level: 2
    duration_ticks: 100

  webber:
    web_count: 3
    cleanup_delay_seconds: 2   # Seconds before webber cobwebs are auto-removed

  burster:
    fuse_ticks: 30
    radius: 3.0
    power: 3.0
    break_blocks: true

# Scent Tracking - Your activity attracts bigger hordes
scent-system:
  max-scent: 100.0
  enabled: true
  sprint-add: 1.5              # Scent gained when sprinting
  kill-add: 0.8                # Scent gained per kill
  jump-add: 0.5                # Scent gained per jump
  decay-amount: 1.2            # Scent lost every interval
  decay-interval-seconds: 4    # How often scent decays
  scent-scale: 15.0            # Higher = less impact on horde size
  # spawn-cap removed - use performance.max-total-zombies instead

# Base Zombie Stats
zombie-settings:
  health: 25.0   # HP (20 HP = 10 hearts)
  damage: 6.0    # Attack damage
  speed: 0.32    # Movement speed
  allow-baby-zombies: false
  allow-zombie-villagers: true
  allow-daylight-burning: true   # If false, custom (non-NORMAL) zombies are protected from burning in daylight
  zombie-guts:
    enabled: true  # Master switch: consume to ignore zombies 10 min (reduces max health to 5 hearts)
    # Rare chance for a slain zombie to drop Zombie Guts (requires the master switch above).
    drop:
      enabled: true              # Toggle the rare drop on/off
      chance: 0.02               # Chance per eligible zombie death (0.0-1.0). 0.02 = 2% (rare)
      require-player-kill: true  # Only drop when a player lands the killing blow (anti-farm)

  # Extra custom drops on zombie death (stacks with, and is independent of, the Zombie Guts drop above).
  # Two separate tables: 'normal' for ordinary kills and 'bloodmoon' for kills during a blood moon.
  # Each entry: material (a Bukkit Material name), amount (a number "3" or an inclusive range "1-2"),
  # and chance (0.0-1.0 rolled per zombie death). Invalid materials are skipped with a console warning.
  custom-drops:
    enabled: true
    require-player-kill: true     # Anti-farm: only roll drops when a player lands the killing blow
    normal:                       # Drops on a normal (non-blood-moon) kill
      - material: IRON_NUGGET
        amount: 1-2
        chance: 0.10
      - material: ARROW
        amount: 1-3
        chance: 0.08
      - material: GOLD_NUGGET
        amount: 1
        chance: 0.03
    bloodmoon:                    # Drops during a blood moon (rarer / better loot)
      - material: EMERALD
        amount: 1
        chance: 0.08
      - material: IRON_INGOT
        amount: 1-2
        chance: 0.05
      - material: DIAMOND
        amount: 1
        chance: 0.01

  # Console commands run when a zombie is killed. Like custom-drops, two separate tables:
  # 'normal' for ordinary kills and 'bloodmoon' for kills during a blood moon. Each entry:
  # command (run from console; %player% is replaced with the killer's name) and chance
  # (0.0-1.0 rolled per zombie death). Entries containing %player% are skipped when there
  # is no player killer.
  kill-commands:
    enabled: false
    require-player-kill: true     # Anti-farm: only roll commands when a player lands the killing blow
    # Optional server-wide broadcast on a zombie kill. Set your own message and how often it fires.
    # %player% is replaced with the killer's name (broadcast is skipped when there is no player killer
    # and the message uses %player%). Supports & color codes.
    broadcast:
      enabled: false
      chance: 0.02                # 0.0-1.0 chance per zombie death to send the broadcast
      message: "&c%player% &7took down a zombie!"
    normal:                       # Commands on a normal (non-blood-moon) kill
      - command: "eco give %player% 5"
        chance: 0.10
    bloodmoon:                    # Commands during a blood moon
      - command: "eco give %player% 25"
        chance: 0.10

# Spawning
apocalypse-settings:
  spawn-rate: 1500              # Ticks between spawns (20 ticks = 1 second)
  spawn-radius: 35             # Blocks around player
  base-horde-size: 6           # Base zombies per horde
  horde-variance: 4            # Random +0 to +4 zombies
  max-single-horde-size: 30    # Hard cap on one player's horde per spawn cycle (after blood moon/scent multipliers)
  day-spawn-chance: 0.02
  day-horde-size: 2
  day-horde-variance: 2      # 2% chance to spawn during day
  use-mob-blacklist: true      # If true, prevents listed mobs
  rising-animation: true        # Enable/disable zombie rise animation from ground
  mob-list:                    # Case-insensitive Bukkit names or minecraft: names; filters NATURAL and CHUNK_GEN spawns
    - SKELETON
    - WITHER_SKELETON
    - SPIDER
    - CREEPER

# Blood Moon - Happens every X in-game days at night
bloodmoon:
  enabled: true
  interval-days: 14  # Every 14 in-game days (1 day = 20 minutes)
  bossbar-title: "&4&l☠ BLOOD MOON ☠ &cRemaining: %time%"
  multipliers:       # Stats multiplied during Blood Moon
    health: 1.5
    damage: 1.3
    speed: 1.1
    horde-size: 1.5
  # CRITICAL FIX: Add force blood moon configuration
  force-duration-minutes: 10  # Duration for /xa forcebloodmoon command
  # Sound played to online players in enabled and lobby worlds when a Blood Moon begins.
  start-sound:
    enabled: true
    name: ENTITY_WITHER_SPAWN
    volume: 1.0
    pitch: 0.7
  # Remove zombies (and MythicMobs Mutants) spawned during the blood moon when the event ends.
  # Zombies that already existed before the blood moon are left alone. They vanish with a small
  # smoke puff and drop nothing (prevents an end-of-event loot dump).
  despawn-on-end: true
  # Countdown warnings before a natural Blood Moon. Broadcast server-wide at dawn on each of the
  # last 'days-before' days (messages are configurable per remaining day in messages.yml under
  # bloodmoon.warning). Forced blood moons (/xa forcebloodmoon) never trigger warnings.
  warning:
    enabled: true
    days-before: 3           # Start warning this many in-game days before the Blood Moon
    title:                   # On-screen title shown alongside the chat warning
      enabled: true
      fade-in-ticks: 10
      stay-ticks: 70
      fade-out-ticks: 20
    sound:                   # Ambient sound played with the warning (any Bukkit Sound name)
      enabled: true
      name: ENTITY_WITHER_AMBIENT
      volume: 1.0
      pitch: 0.6

# Performance & Safety Guards
performance:
  max-total-zombies: 300        # Maximum total zombies per world (furthest are culled above this)
  tps-threshold: 15.0           # Pause NEW zombie spawns when server TPS drops below this; resume once it recovers
  check-interval-ticks: 100     # How often to check performance (5 seconds)

# Visuals
visuals:
  use-nametags: true          # Color-coded names above zombies
  nametag-always-visible: true  # If false, only visible when looking at zombie

# ============================================================
# MythicMobs Smart Spawn Integration
# Add this block anywhere in your config.yml
# ============================================================
mythicmobs:
  integration:

    # The internal MythicMobs mob name (case-sensitive, must match your .yml mob file).
    # This is just an example — replace it with the internal name of any mob you define
    # in MythicMobs (e.g. the name from your own MythicMobs/Mobs/*.yml file).
    mob-type: "ExampleMutantBoss"

    # Maximum number of this mob allowed alive across the entire server at once.
    # Set to 0 to disable the cap (not recommended).
    max-global-cap: 15

    # Chance (0.0–1.0) to attempt a spawn each tick interval per online player.
    # 0.05 = 5% chance every tick-interval ticks.
    spawn-chance: 0.05

    # How many ticks between each chance roll (20 ticks = 1 second).
    # Default 100 = rolls every 5 seconds per player.
    spawn-tick-interval: 100

    # Sound played only to players close enough to each successful Mutant spawn.
    spawn-sound:
      enabled: true
      name: ENTITY_ENDER_DRAGON_GROWL
      volume: 1.0
      pitch: 0.8
      radius: 48.0

    # Distance from a player where the mob tries to spawn.
    # The system prefers locations outside line-of-sight within this range.
    spawn-radius:
      min: 20   # Minimum blocks from player
      max: 40   # Maximum blocks from player
