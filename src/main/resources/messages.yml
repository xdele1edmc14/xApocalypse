# xApocalypse v1.6.2 - Localization File
# SUPPORTS BOTH FORMATS:
# - MiniMessage: <gradient:red:blue>Text</gradient>, <rainbow>Text</rainbow>, <#FF5555>Hex</#FF5555>
# - Legacy: &a, &b, &l, &n, §c, etc.
# Use {0}, {1} for placeholders

# General Messages
prefix: "&4[xApocalypse]&r"
reload-success: "<gradient:green:aqua>Configuration and language files reloaded!</gradient>"
reload-error: "&cError reloading: {0}"
no-permission: "&cYou don't have permission to use this command."
player-not-found: "&cPlayer not found: {0}"

# Commands
commands:
  unknown: "&cUnknown sub-command: &f{0}&c. Try &f/xa help&c."
  help:
    title: "&8&m       &r &c&lxApocalypse &r&7v1.6.2 &8&m       "
    author: "&7Created by &fxDele1ed"
    help: "&c/xa help &8» &7Show this command list"
    spawn: "&c/xa spawn <type|horde> [count] [radius] &8» &7Spawn zombies"
    item: "&c/xa item <item> [player] [amount] &8» &7Get special items"
    forcebloodmoon: "&c/xa forcebloodmoon [minutes] &8(&7fbm&8) &8» &7Force a Blood Moon"
    stopbloodmoon: "&c/xa stopbloodmoon &8(&7sbm&8) &8» &7End the Blood Moon"
    reload: "&c/xa reload &8» &7Reload config and language files"
    footer: "&8Roots: &7/xa &8• &7/xapocalypse &8• &7/zombie"

  item:
    usage: "&cUsage: /xa item <item> [player] [amount]"
    unknown: "&cUnknown item: {0}"
    received: "&a[!] &7You received: &f{0}&7!"
    given: "&a[!] &7Gave &f{1}&7 to &f{0}&7!"

# Blood Moon
bloodmoon:
  force-start: "<gradient:dark_red:red><bold>Blood Moon has been FORCE STARTED!</bold></gradient>"
  force-time-set: "&7(Time set to night to begin event immediately)"
  natural-start: "&4&lBLOOD MOON RISES! &cPrepare for battle!"
  # Countdown warnings (broadcast at dawn on each of the last 'days-before' days — see config.yml).
  # Add/edit a numbered list per remaining-day count; 'generic' ({0} = days left) is used when no
  # exact match exists (e.g. days-before > 3).
  warning:
    days:
      "3":
        - "&c⚠ &7The air feels… wrong."
        - "&7Villagers whisper of a coming &4Blood Moon&7."
        - "&c3 days remain. &7Prepare… or be consumed."
      "2":
        - "&c⚠ &7The sky grows darker each night."
        - "&7Creatures stir… stronger than before."
        - "&7The &4Blood Moon &7rises in &c2 days&7."
      "1":
        - "&4☠ &cThis is your final warning."
        - "&7The &4Blood Moon &7rises &ctomorrow night&7."
        - "&7Sharpen your blades. Lock your doors."
        - "&cSurvive… if you can."
    generic:
      - "&c⚠ &7A &4Blood Moon &7approaches in &c{0} days&7."
    title: "&4⚠ Blood Moon ⚠"
    subtitle: "&c{0} day(s) remain…"

# Immunity System
immunity:
  item-name: "&2&lZombie Guts"
  item-lore:
    - "&7Consume to gain temporary immunity"
    - "&cReduces Max Health to 5 Hearts for 10 minutes"

  consumed: "&2&lYou consumed Zombie Guts!&a Zombies will ignore you for 10 minutes."
  already-immune: "&eYou are already immune! Wait for the effect to wear off."
  bossbar: "&2&lZombie Guts Immunity: &a{0}"
  expired: "&6&lYour Zombie Guts immunity has worn off!"
  health-restored: "&aYour maximum health has been restored."
